name: enclosure-ci

on:
  pull_request:
    branches: [main]
    paths: ['enclosure/**']
  push:
    paths: ['enclosure/**']
    
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enclosure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-stls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install CadQuery
        run: pip install "cadquery>=2.4,<3"
      - name: Build STLs
        run: python enclosure/main.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enclosure-stls
          path: enclosure/build/*.stl
