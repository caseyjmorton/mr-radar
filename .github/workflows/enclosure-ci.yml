name: enclosure-ci

on:
  pull_request:
    branches: [main]
    paths: ['enclosure/**']
  push:
    branches: [main]
    paths: ['enclosure/**']

permissions:
  contents: read

concurrency:
  group: enclosure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-stls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install CadQuery
        run: pip install "cadquery>=2.4,<3"
      - name: Build STLs
        run: python enclosure/main.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enclosure-stls
          path: enclosure/build/*.stl
