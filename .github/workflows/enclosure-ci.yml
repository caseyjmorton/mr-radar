name: enclosure-ci

on:
  pull_request:
    branches: [main]
    paths: ['enclosure/**']
  push:
    paths: ['enclosure/**']
    
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enclosure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-stls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install CadQuery
        run: pip install "cadquery>=2.4,<3"
      - name: Build STLs
        run: python enclosure/main.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enclosure-stls
          path: enclosure/build/*.stl
