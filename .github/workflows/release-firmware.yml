name: release-firmware

# Builds the flashable firmware binary (MicroPython base + LittleFS image
# holding all source files), generates the OTA manifest, and creates a GitHub
# Release. Triggered by a firmware-v*.*.* tag or manually.
#
# ONE SUPPORTED TARGET: the Seeed XIAO ESP32S3 (8 MB flash, 8 MB octal PSRAM).
# The ESP32-C3 and the 4 MB / 2 MB-PSRAM ESP32-S3-Zero were dropped: neither
# has the memory headroom to hold the 115,200-byte framebuffer alongside WiFi
# without fragmentation stalls, and the sweep animation misses its frame budget
# on both.
#
# FLASH SIZE IS LOAD-BEARING. MicroPython's ESP32 partition table contains NO
# vfs entry — the filesystem is created at first boot, sized to fill everything
# from the end of the app partition (0x200000) to the end of *detected* flash.
# That is 6 MB on an 8 MB board. LittleFS records its block count in the
# superblock, so an image built for a different flash size will not mount:
# MicroPython silently reformats, erasing every .py file, and the device boots
# to a bare REPL with no main.py — no display, no AP, nothing on serial. It
# looks exactly like a bricked board. That is what shipped in firmware-v0.2.1
# (which also used the wrong, non-PSRAM MicroPython base).
#
# Flash layout (XIAO ESP32S3, 8 MB flash):
#   0x000000  MicroPython base firmware (~1.8 MB)
#   0x200000  LittleFS partition (6 MB = 1536 x 4096) — .py files, no config.json
#
# Flashing a fresh device:
#   esptool --chip esp32s3 erase-flash
#   esptool --chip esp32s3 write-flash 0x0 mr-radar-firmware-s3-vX.Y.Z.bin
on:
  push:
    tags: ['firmware-v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. firmware-v1.2.3)'
        required: true

permissions:
  contents: write  # create GitHub Release and upload assets

concurrency:
  group: release-firmware
  cancel-in-progress: false

env:
  # Pin the MicroPython base firmware. To upgrade: find the new URL at
  # https://micropython.org/download/ESP32_GENERIC_S3/ and update this line.
  # Verify the filename actually exists before tagging.
  #
  # MUST be the SPIRAM_OCT variant, not plain GENERIC_S3: the plain build
  # doesn't enable octal PSRAM, which leaves only ~226 KB of internal SRAM as
  # heap and reliably fails the 115,200-byte display framebuffer allocation in
  # portal.py with MemoryError. Verified on a XIAO ESP32S3 — free heap went
  # from 226 KB (plain build) to 8.3 MB (SPIRAM_OCT) for the same version.
  MICROPYTHON_URL: "https://micropython.org/resources/firmware/ESP32_GENERIC_S3-SPIRAM_OCT-20260824-v1.29.0.bin"

  # Filesystem geometry. BLOCK_COUNT * BLOCK_SIZE must equal the vfs partition
  # MicroPython creates at runtime (flash size - 0x200000), or the image will
  # not mount. See the flash-layout note at the top of this file.
  LFS_BLOCK_SIZE: "4096"
  LFS_BLOCKS:     "1536"   # 6 MB filesystem on 8 MB flash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#firmware-v}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: pip install "esptool>=5,<6" littlefs-python

      - name: Build LittleFS image
        run: |
          python3 - <<'PYEOF'
          from littlefs import LittleFS
          import os

          BLOCK_SIZE  = int(os.environ["LFS_BLOCK_SIZE"])
          BLOCK_COUNT = int(os.environ["LFS_BLOCKS"])

          src_dir = "firmware/src"
          names = [f for f in sorted(os.listdir(src_dir))
                   if os.path.isfile(os.path.join(src_dir, f))]
          print(f"source files ({len(names)}): {', '.join(names)}")

          fs = LittleFS(block_size=BLOCK_SIZE, block_count=BLOCK_COUNT,
                        name_max=255)
          for fname in names:
              with open(os.path.join(src_dir, fname), "rb") as f:
                  data = f.read()
              with fs.open(f"/{fname}", "wb") as lf:
                  lf.write(data)
              print(f"  added /{fname} ({len(data):,} bytes)")

          with open("lfs.bin", "wb") as out:
              out.write(bytes(fs.context.buffer))

          size = os.path.getsize("lfs.bin")
          expected = BLOCK_COUNT * BLOCK_SIZE
          if size != expected:
              raise SystemExit(f"lfs.bin: got {size} bytes, expected {expected}")
          print(f"LittleFS image: {BLOCK_COUNT} x {BLOCK_SIZE} = {size:,} bytes")
          PYEOF

      - name: Build firmware binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -fsSL "$MICROPYTHON_URL" -o micropython.bin
          echo "MicroPython base: $(wc -c < micropython.bin) bytes"
          python3 -m esptool --chip esp32s3 merge-bin \
            --flash-size 8MB \
            -o "mr-radar-firmware-s3-v${VERSION}.bin" \
            0x0       micropython.bin \
            0x200000  lfs.bin
          echo "Merged binary: $(wc -c < "mr-radar-firmware-s3-v${VERSION}.bin") bytes"

      - name: Verify the embedded filesystem mounts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 - <<'PYEOF'
          from littlefs import LittleFS
          import os

          BLOCK_SIZE  = int(os.environ["LFS_BLOCK_SIZE"])
          BLOCK_COUNT = int(os.environ["LFS_BLOCKS"])
          path = f"mr-radar-firmware-s3-v{os.environ['VERSION']}.bin"

          # Read the filesystem back out of the *merged* artifact and mount it.
          # This is the check that would have caught firmware-v0.2.1 in CI.
          data = open(path, "rb").read()
          region = data[0x200000:0x200000 + BLOCK_COUNT * BLOCK_SIZE]

          fs = LittleFS(block_size=BLOCK_SIZE, block_count=BLOCK_COUNT,
                        name_max=255, mount=False)
          fs.context.buffer[:] = bytearray(region)
          fs.mount()

          found = sorted(fs.listdir("/"))
          print(f"mounted OK from {path} @0x200000: {', '.join(found)}")
          for required in ("main.py", "config.py", "radar.py", "version.py"):
              if required not in found:
                  raise SystemExit(f"missing {required} in embedded filesystem")
          PYEOF
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Generate OTA manifest
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, sys

          version  = os.environ["VERSION"]
          tag      = os.environ["TAG"]
          repo     = os.environ["REPO"]
          # Use raw GitHub content URLs so individual .py files don't need to
          # be uploaded as release assets. The tag ref is permanent and stable.
          base_url = f"https://raw.githubusercontent.com/{repo}/{tag}/firmware/src"

          files = []
          src_dir = "firmware/src"
          for fname in sorted(os.listdir(src_dir)):
              fpath = os.path.join(src_dir, fname)
              if not os.path.isfile(fpath):
                  continue
              data = open(fpath, "rb").read()
              files.append({
                  "path":   fname,
                  "url":    f"{base_url}/{fname}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size":   len(data),
              })

          manifest = {"version": version, "files": files}
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG:     ${{ steps.version.outputs.tag }}
          REPO:    ${{ github.repository }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --title "Firmware ${VERSION}" \
            --generate-notes \
            --verify-tag \
            "mr-radar-firmware-s3-v${VERSION}.bin" \
            manifest.json
