name: release-firmware

# Builds a flashable binary per supported chip (MicroPython base + LittleFS
# image with all source files, identical across chips), uploads individual
# source files for OTA delivery, and creates a GitHub Release. Triggered by a
# firmware-v*.*.* tag or manually.
#
# Flash layout (4 MB flash, both chips):
#   0x000000  MicroPython base firmware (~1.7 MB)
#   0x200000  LittleFS partition (2 MB) — source .py files, no config.json
#
# Flashing a fresh device:
#   esptool.py --chip esp32s3 erase_flash   (S3-Zero)
#   esptool.py --chip esp32s3 write_flash 0x0 mr-radar-firmware-s3-vX.Y.Z.bin
#
#   esptool.py --chip esp32c3 erase_flash   (C3)
#   esptool.py --chip esp32c3 write_flash 0x0 mr-radar-firmware-c3-vX.Y.Z.bin
on:
  push:
    tags: ['firmware-v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. firmware-v1.2.3)'
        required: true

permissions:
  contents: write  # create GitHub Release and upload assets

concurrency:
  group: release-firmware
  cancel-in-progress: false

env:
  # Pin the MicroPython base firmware per chip. To upgrade: find the new URL
  # at https://micropython.org/download/ESP32_GENERIC_S3/ (or _C3/) and
  # update these lines. Verify both filenames actually exist before tagging —
  # a given MicroPython version isn't guaranteed to publish the same day for
  # every port.
  MICROPYTHON_S3_URL: "https://micropython.org/resources/firmware/ESP32_GENERIC_S3-20260406-v1.28.0.bin"
  MICROPYTHON_C3_URL: "https://micropython.org/resources/firmware/ESP32_GENERIC_C3-20260406-v1.28.0.bin"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#firmware-v}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: pip install esptool littlefs-python

      - name: Build LittleFS image
        run: |
          python3 - <<'PYEOF'
          from littlefs import LittleFS
          import os

          # 4 MB flash; LittleFS occupies 0x200000–0x3FFFFF (2 MB). Shared
          # by both chip variants — the source tree is identical.
          BLOCK_SIZE  = 4096
          BLOCK_COUNT = 512

          fs = LittleFS(block_size=BLOCK_SIZE, block_count=BLOCK_COUNT, name_max=255)
          src_dir = "firmware/src"
          for fname in sorted(os.listdir(src_dir)):
              fpath = os.path.join(src_dir, fname)
              if not os.path.isfile(fpath):
                  continue
              with open(fpath, "rb") as f:
                  data = f.read()
              with fs.open(f"/{fname}", "wb") as lf:
                  lf.write(data)
              print(f"  added /{fname} ({len(data):,} bytes)")

          with open("lfs.bin", "wb") as out:
              out.write(bytes(fs.context.buffer))
          print(f"LittleFS image: {os.path.getsize('lfs.bin'):,} bytes")
          PYEOF

      - name: Build S3 binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -fsSL "$MICROPYTHON_S3_URL" -o micropython-s3.bin
          echo "MicroPython S3 base: $(wc -c < micropython-s3.bin) bytes"
          python3 -m esptool --chip esp32s3 merge_bin \
            -o "mr-radar-firmware-s3-v${VERSION}.bin" \
            0x0       micropython-s3.bin \
            0x200000  lfs.bin
          echo "Merged S3 binary: $(wc -c < "mr-radar-firmware-s3-v${VERSION}.bin") bytes"

      - name: Build C3 binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -fsSL "$MICROPYTHON_C3_URL" -o micropython-c3.bin
          echo "MicroPython C3 base: $(wc -c < micropython-c3.bin) bytes"
          python3 -m esptool --chip esp32c3 merge_bin \
            -o "mr-radar-firmware-c3-v${VERSION}.bin" \
            0x0       micropython-c3.bin \
            0x200000  lfs.bin
          echo "Merged C3 binary: $(wc -c < "mr-radar-firmware-c3-v${VERSION}.bin") bytes"

      - name: Generate OTA manifest
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os, sys

          version  = os.environ["VERSION"]
          tag      = os.environ["TAG"]
          repo     = os.environ["REPO"]
          # Use raw GitHub content URLs so individual .py files don't need to
          # be uploaded as release assets. The tag ref is permanent and
          # stable. One manifest covers both chips — the source is shared.
          base_url = f"https://raw.githubusercontent.com/{repo}/{tag}/firmware/src"

          files = []
          src_dir = "firmware/src"
          for fname in sorted(os.listdir(src_dir)):
              fpath = os.path.join(src_dir, fname)
              if not os.path.isfile(fpath):
                  continue
              data = open(fpath, "rb").read()
              files.append({
                  "path":   fname,
                  "url":    f"{base_url}/{fname}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size":   len(data),
              })

          manifest = {"version": version, "files": files}
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG:     ${{ steps.version.outputs.tag }}
          REPO:    ${{ github.repository }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --title "Firmware ${VERSION}" \
            --generate-notes \
            --verify-tag \
            "mr-radar-firmware-s3-v${VERSION}.bin" \
            "mr-radar-firmware-c3-v${VERSION}.bin" \
            manifest.json
