name: renderer-ci

# Runs on every PR (including from forks). Because this is a `pull_request`
# workflow with a read-only token and no environment, repository/environment
# secrets are NOT exposed to fork PRs — untrusted code can never read them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: renderer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate Docker image builds
        run: docker build -t mr-radar-renderer:ci .
