name: renderer-ci

# Runs on every PR (including from forks). Because this is a `pull_request`
# workflow with a read-only token and no environment, repository/environment
# secrets are NOT exposed to fork PRs — untrusted code can never read them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: renderer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: renderer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate Docker image builds
        run: docker build -t mr-radar-renderer:ci .
