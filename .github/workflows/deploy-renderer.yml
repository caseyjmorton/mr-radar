name: deploy-renderer

# Deploys the renderer to fly.io. Triggers on:
#   - push to main (after a PR merges with renderer changes)
#   - renderer-v*.*.* tag (the canonical release path)
# Never runs on pull_request, so FLY_API_TOKEN is never exposed to fork code.
# The token lives in the `production` environment, which requires a reviewer
# and is restricted to protected branches/tags.
on:
  push:
    branches: [main]
    paths:
      - 'renderer/**'
      - '.github/workflows/deploy-renderer.yml'
    tags: ['renderer-v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read

# Never cancel an in-flight deploy; queue instead.
concurrency:
  group: deploy-renderer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: renderer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
      - name: Deploy to fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
