name: firmware-ci

# The firmware is MicroPython and can't run its hardware imports (machine,
# framebuf, micropython) under CPython, but byte-compiling catches syntax
# errors — including in the @micropython.viper / @native hot loops — before
# they ever reach a reflash. This is a cheap, no-dependency safety net.
on:
  pull_request:
    branches: [main]
    paths: ['firmware/**']
  push:
    paths: ['firmware/**']
    
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Byte-compile firmware sources
        run: python3 -m compileall -q firmware
