name: release-renderer

# Builds and pushes the renderer Docker image to GHCR, then creates a
# GitHub Release. Triggered by a renderer-v*.*.* tag or manually.
# The deploy-renderer workflow handles the fly.io deploy on the same tag.
on:
  push:
    tags: ['renderer-v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. renderer-v1.2.3)'
        required: true

permissions:
  contents: write  # create GitHub Release
  packages: write  # push to GHCR

concurrency:
  group: release-renderer
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#renderer-v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/mr-radar-renderer"
          docker build -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" renderer/
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/mr-radar-renderer"
          printf '## Docker image\n\n```\n%s:%s\n%s:latest\n```\n\nPull and run:\n```bash\ndocker pull %s:%s\ndocker run -p 3000:3000 %s:%s\n```\n' \
            "$IMAGE" "$VERSION" "$IMAGE" \
            "$IMAGE" "$VERSION" \
            "$IMAGE" "$VERSION" > release-notes.md
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Renderer ${VERSION}" \
            --verify-tag \
            --notes-file release-notes.md
