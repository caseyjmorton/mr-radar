version: 2
updates:
  # Renderer npm dependencies (express, sharp, eslint).
  - package-ecosystem: npm
    directory: /renderer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      renderer-deps:
        patterns:
          - '*'

  # Keep the SHA-pinned GitHub Actions current (Dependabot understands the
  # `# vX.Y.Z` comment next to each pinned SHA and bumps both together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
